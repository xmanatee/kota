name: Apple clients

on:
  push:
    branches: [main]
    paths:
      - 'clients/apple/**'
      - 'clients/conformance/**'
      - 'schema/ui-surface.schema.json'
      - 'scripts/generate-ui-surface-bindings.mjs'
      - 'scripts/ui-surface-*.mjs'
      - 'scripts/ui-surface-typescript-runtime.template'
      - 'src/core/daemon/ui-surface.ts'
      - '.github/workflows/apple-client.yml'
  pull_request:
    paths:
      - 'clients/apple/**'
      - 'clients/conformance/**'
      - 'schema/ui-surface.schema.json'
      - 'scripts/generate-ui-surface-bindings.mjs'
      - 'scripts/ui-surface-*.mjs'
      - 'scripts/ui-surface-typescript-runtime.template'
      - 'src/core/daemon/ui-surface.ts'
      - '.github/workflows/apple-client.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: clients/apple

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install generator dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Check generated contract bindings
        working-directory: .
        run: pnpm check:ui-bindings

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Swift version
        run: swift --version

      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: clients/apple/.build
          key: ${{ runner.os }}-swift-${{ hashFiles('clients/apple/Package.swift', 'clients/apple/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Build (macOS)
        run: swift build

      - name: Test (macOS)
        run: swift test

      - name: Build KotaiOS for iOS Simulator
        run: xcodebuild build -scheme KotaiOS -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/ios

      - name: Test on iOS Simulator
        run: xcodebuild test -scheme KotaApple-Package -destination 'platform=iOS Simulator,name=iPhone 15' -derivedDataPath .build/ios
