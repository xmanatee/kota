name: Mobile client

on:
  push:
    branches: [main]
    paths:
      - 'clients/mobile/**'
      - 'clients/shared/**'
      - 'clients/conformance/**'
      - 'schema/ui-surface.schema.json'
      - 'scripts/generate-ui-surface-bindings.mjs'
      - 'scripts/ui-surface-*.mjs'
      - 'scripts/ui-surface-typescript-runtime.template'
      - 'src/core/daemon/ui-surface.ts'
      - '.github/workflows/mobile-client.yml'
  pull_request:
    paths:
      - 'clients/mobile/**'
      - 'clients/shared/**'
      - 'clients/conformance/**'
      - 'schema/ui-surface.schema.json'
      - 'scripts/generate-ui-surface-bindings.mjs'
      - 'scripts/ui-surface-*.mjs'
      - 'scripts/ui-surface-typescript-runtime.template'
      - 'src/core/daemon/ui-surface.ts'
      - '.github/workflows/mobile-client.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: clients/mobile

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            clients/mobile/pnpm-lock.yaml

      - name: Install generator dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Check generated contract bindings
        working-directory: .
        run: pnpm check:ui-bindings

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Bundle Android production app
        run: pnpm bundle:android --output-dir "$RUNNER_TEMP/kota-mobile-export"

      - name: Test
        run: pnpm test --ci
