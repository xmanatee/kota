name: Server confidence

on:
  pull_request:
    paths-ignore:
      - 'clients/**'
      - '.github/workflows/apple-client.yml'
      - '.github/workflows/mobile-client.yml'
      - '.github/workflows/web-client.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'clients/**'
      - '.github/workflows/apple-client.yml'
      - '.github/workflows/mobile-client.yml'
      - '.github/workflows/web-client.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate server
        run: pnpm check
