# Requires Docker Compose >= 2.30 (literal, non-interpolated secret inputs).
name: ${KOTA_TELEGRAM_INSTANCE:-telegram-assistant}
services:
  kota:
    build:
      context: ../../
      dockerfile: deploy/telegram-assistant/Dockerfile
      target: production
    image: ${KOTA_TELEGRAM_INSTANCE:-kota-telegram-assistant}:latest
    container_name: ${KOTA_TELEGRAM_INSTANCE:-kota-telegram}
    restart: unless-stopped
    stop_grace_period: 90s
    init: true
    network_mode: ${KOTA_TELEGRAM_NETWORK_MODE:-bridge}
    env_file:
      - path: ${KOTA_TELEGRAM_ENV_FILE:-/dev/null}
        format: raw
    volumes:
      - kota-state:/var/lib/kota
    healthcheck:
      test: ["CMD", "node", "/opt/kota/bin/kota.mjs", "daemon", "status"]
      interval: 10s
      timeout: 10s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  kota-state:
    name: ${KOTA_TELEGRAM_INSTANCE:-kota-telegram}-state
